# Research type: literature review (Q22 example, docs/step-by-step-journey-audit.md §3). No data of its own:
# drops framework (G6), data_collected, plan_locked (G8) and analyzed (G9). Design & ethics (G7) moves right
# after scoping and stays mandatory as a light "no human participants" confirmation (decision 5, X.43.8).
name = "literature_review"
version = 1
label = "Literature review"
description = "A review of published work with no primary data collection: search, screen, extract, synthesise and write."
human_participants = false

