# The research-path guide (X.55): what each stage, gate and exit condition means, advice-only review types and
# synthesis methods. Data only; loaded and checked by app/guidance.py, served by GET /api/guide. Nothing here
# decides anything: suggestions come from the real exit conditions (app/exit_conditions.py).
version = 1

# ---------- Stages: what reaching the stage means, what is advisable, which screen does the work (omit = no screen yet)
[stages.idea]
title = "Idea"
meaning = "You have a topic or a hunch, not yet a question that can be answered from evidence."
advice = "Write one focused research question and 1-3 objectives. Note the population, the phenomenon or intervention, and the outcome you care about. A narrow, answerable question saves weeks later."
step = "scope"

[stages.scoped]
title = "Scoped"
meaning = "Your supervisor or you (as owner) agreed the topic direction (gate G1). The question is now the reference point for every later decision."
advice = "Before searching, decide what counts as evidence: inclusion and exclusion criteria (PICO, PICOC or SPIDER) and a few seed papers you already know are relevant."
step = "scope"

[stages.search_planned]
title = "Search planned"
meaning = "Your search strategy and criteria are approved (gate G2) and locked, so the search is reproducible."
advice = "Search several databases, not one. Record every search string. Check that your seed papers are found; if they are not, the search needs revising before you screen."
step = "criteria"

[stages.retrieved]
title = "Records retrieved"
meaning = "Searches have run and the records are stored with their counts, which feed the PRISMA flow diagram."
advice = "Remove duplicates and verify metadata of auto-retrieved records before screening. Do not judge relevance yet; that is screening."
step = "search"

[stages.screened]
title = "Screened"
meaning = "Every record has an include/exclude decision with a reason, and the included set is approved (gate G3)."
advice = "Screen titles/abstracts first, then full texts. Give a reason for every exclusion. Ideally a second person screens a sample; resolve disagreements before approving."

[stages.extracted]
title = "Data extracted"
meaning = "Key information (design, sample, measures, findings, effect sizes) is taken from each included study, each value backed by a quote, and critical fields are verified (gate G4)."
advice = "Use one extraction form for all studies. Verify high-stakes fields such as effect sizes and sample sizes against the paper yourself. Assess risk of bias / study quality here."

[stages.synthesized]
title = "Synthesised"
meaning = "The evidence has been combined into findings: by meta-analysis, narrative synthesis, thematic synthesis or descriptive mapping."
advice = "Choose the synthesis method that fits your data (see 'Is meta-analysis right for you?' on Research path). Every claim should point to the studies that support it."
step = "ask"

[stages.gaps_selected]
title = "Gaps selected"
meaning = "You have chosen and justified which gaps in the literature your work will address (gate G5)."
advice = "A gap should be supported by at least two studies or by an empty cell in your evidence matrix, not by an impression. Prefer gaps that matter to the field over gaps that are merely untested."

[stages.framework]
title = "Framework"
meaning = "Research questions, hypotheses and the conceptual model are approved (gate G6)."
advice = "Ground each hypothesis in theory and in the reviewed evidence. Define every construct and how it will be measured."

[stages.design_approved]
title = "Design approved"
meaning = "Study design, instruments and ethics are approved by the owner (gate G7)."
advice = "Obtain ethics approval before collecting any data from people. A pure literature review still confirms 'no human participants' here."

[stages.data_collected]
title = "Data collected"
meaning = "Primary data for your own study has been gathered according to the approved design."
advice = "Keep a log of deviations from the design. Store participant data only where your institution allows."

[stages.plan_locked]
title = "Analysis plan locked"
meaning = "The analysis plan is fixed before you look at results (gate G8, owner only)."
advice = "Pre-specify tests, models, subgroups and how missing data is handled. Locking first protects you from accusations of fishing for results. For a meta-analysis, fix the effect measure and model here."

[stages.analyzed]
title = "Analysed"
meaning = "The planned analysis has been run and its interpretation approved (gate G9)."
advice = "Report every planned analysis, including null results. Label any unplanned analysis as exploratory."

[stages.drafted]
title = "Drafted"
meaning = "Manuscript sections are written and each section's text and AI-use level is approved (gate G10)."
advice = "Follow your reporting guideline (for example PRISMA 2020 for systematic reviews) section by section."

[stages.revised]
title = "Revised"
meaning = "The draft has been revised after internal feedback."
advice = "Check every citation still supports the sentence it is attached to."

[stages.submission_ready]
title = "Ready to submit"
meaning = "Final author sign-off and declarations are done (gate G11, owner only)."
advice = "Complete the AI-use disclosure, author contributions, conflicts of interest and data availability statements."

[stages.submitted]
title = "Submitted"
meaning = "The manuscript is with a journal."
advice = "Keep the replication package and search log ready for reviewers' questions."

[stages.revision_loop]
title = "Revise and resubmit"
meaning = "Reviewers asked for changes."
advice = "Answer every reviewer point in a response letter. If a change reopens earlier work (for example a new search), go back to that stage rather than patching the text."

[stages.accepted]
title = "Accepted"
meaning = "The work is accepted for publication."
advice = "Share the preprint and data/code where allowed, and register outputs with your ORCID."

# ---------- Gates
[gates.G1]
title = "Scope"
meaning = "A person confirms the topic direction is worth pursuing."
advice = "Approve when the question is specific enough that you could say whether a given paper is relevant."

[gates.G2]
title = "Search plan"
meaning = "A person approves the search strategy and screening criteria before the bulk search runs."
advice = "Approve when criteria are complete and the search finds your seed papers in a test run."

[gates.G3]
title = "Screening"
meaning = "A person approves the final included set and the audit of any AI-assisted exclusions."
advice = "Approve only when every record has a decision, conflicts are resolved and PRISMA numbers add up."

[gates.G4]
title = "Extraction"
meaning = "A person confirms the critical extracted values are correct."
advice = "Spot-check against the full text; fully verify effect sizes, sample sizes and measures."

[gates.G5]
title = "Gap selection"
meaning = "A person selects and justifies the gaps the work will address."
advice = "Each chosen gap should cite the evidence that shows it is a gap."

[gates.G6]
title = "Framework"
meaning = "A person approves the research questions, hypotheses and model."
advice = "Check each hypothesis follows from theory and the reviewed evidence."

[gates.G7]
title = "Design"
meaning = "The owner approves the design, instruments and ethics."
advice = "Do not collect data from people before this is approved."

[gates.G8]
title = "Analysis plan"
meaning = "The owner locks the analysis plan before results are seen."
advice = "Lock it before opening the data, so the analysis is confirmatory."

[gates.G9]
title = "Results"
meaning = "A person approves the interpretation of the results."
advice = "Check conclusions do not go further than the analysis supports."

[gates.G10]
title = "Draft"
meaning = "A person approves a manuscript section and its AI-use level."
advice = "Read every sentence as the accountable author."

[gates.G11]
title = "Final sign-off"
meaning = "The owner signs off the submission and declarations."
advice = "Only the accountable author can sign off; nothing is submitted without it."

