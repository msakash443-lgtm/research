# ---------- Review types (advice only; nothing is saved)
[[paths]]
id = "systematic_review_meta_analysis"
title = "Systematic review with meta-analysis"
summary = "A reproducible search and screening of all relevant studies, then statistical pooling of their effect sizes into one estimate."
choose_when = ["Your question asks whether something works or how strongly two things are related", "Several studies measure the same outcome in a comparable way", "Studies report effect sizes or the numbers needed to compute them"]
you_need = ["A protocol written before searching", "Two or more databases and a recorded search", "Effect sizes with sample sizes from each study", "An analysis plan locked before pooling"]
synthesis = "meta_analysis"
reporting_guideline = "PRISMA-2020"
in_this_app = "Search, screening and PRISMA counts are supported. Extraction screens and pooling are not built yet, so the meta-analysis itself has to be done outside the app for now."

[[paths]]
id = "systematic_review_narrative"
title = "Systematic review with narrative synthesis"
summary = "The same reproducible search and screening, but studies are combined in structured text and tables because they are too different to pool."
choose_when = ["Your question is about effects or relationships", "Studies differ too much in design, measures or populations to pool", "Effect sizes are missing in many studies"]
you_need = ["A protocol and a recorded search", "A grouping plan (by design, population or outcome)", "A consistent way to summarise direction of effect"]
synthesis = "narrative_swim"
reporting_guideline = "PRISMA-2020"
in_this_app = "Search, screening, PRISMA and the Ask step are supported; structured synthesis tables are not built yet."

[[paths]]
id = "scoping_review"
title = "Scoping review"
summary = "Maps what research exists on a broad topic: which methods, populations and contexts have been studied, and where nothing has."
choose_when = ["The topic is broad or new and you don't yet know what evidence exists", "You want to find gaps rather than estimate an effect", "You are preparing for a later systematic review"]
you_need = ["A recorded search", "A charting form for study characteristics"]
synthesis = "descriptive_mapping"
reporting_guideline = "PRISMA-ScR"
in_this_app = "Search, screening and PRISMA are supported. The coverage matrix and publication trends exist in the API only."

[[paths]]
id = "qualitative_evidence_synthesis"
title = "Qualitative evidence synthesis"
summary = "Brings together findings from qualitative studies (interviews, focus groups, ethnographies) to understand experiences, meanings or views."
choose_when = ["Your question is about how or why, experiences or perceptions", "Most relevant studies are qualitative"]
you_need = ["A recorded search", "A quality appraisal tool for qualitative studies", "A coding approach for findings"]
synthesis = "thematic_synthesis"
reporting_guideline = "ENTREQ"
in_this_app = "Search and screening are supported. Thematic clustering exists in the API only and is off by default."

[[paths]]
id = "narrative_review"
title = "Narrative literature review"
summary = "An expert, argued overview of a field. It is not designed to be exhaustive or reproducible."
choose_when = ["You need background or a conceptual argument (for example a thesis literature chapter)", "Reproducibility is not required by your examiner or journal"]
you_need = ["A clear argument and structure", "Honest statement of how sources were found"]
synthesis = "narrative_swim"
in_this_app = "Sources, verification and the Ask step are supported; you can skip the formal search approval if your supervisor agrees."

[[questions]]
id = "aim"
text = "What is your question trying to do?"
[[questions.answers]]
label = "Find out whether something works, or how strongly two things are related"
points_to = ["systematic_review_meta_analysis", "systematic_review_narrative"]
[[questions.answers]]
label = "Map what research exists on a broad topic"
points_to = ["scoping_review"]
[[questions.answers]]
label = "Understand experiences, meanings or views"
points_to = ["qualitative_evidence_synthesis"]
[[questions.answers]]
label = "Give an expert overview or build an argument"
points_to = ["narrative_review"]

[[questions]]
id = "numbers"
text = "Will the studies you expect report numbers you could compare (means, correlations, odds ratios)?"
[[questions.answers]]
label = "Yes, mostly the same outcome measured in a similar way"
points_to = ["systematic_review_meta_analysis"]
[[questions.answers]]
label = "Yes, but outcomes and designs vary a lot"
points_to = ["systematic_review_narrative"]
[[questions.answers]]
label = "No, the studies are mostly qualitative"
points_to = ["qualitative_evidence_synthesis"]
[[questions.answers]]
label = "I don't know yet"
points_to = ["scoping_review", "systematic_review_narrative"]

[[questions]]
id = "reproducible"
text = "Does your examiner or journal expect a documented search that someone else could repeat?"
[[questions.answers]]
label = "Yes"
points_to = ["systematic_review_meta_analysis", "systematic_review_narrative", "scoping_review", "qualitative_evidence_synthesis"]
[[questions.answers]]
label = "No"
points_to = ["narrative_review"]

[[questions]]
id = "volume"
text = "Roughly how many comparable studies do you expect?"
[[questions.answers]]
label = "Fewer than two"
points_to = ["systematic_review_narrative", "narrative_review"]
[[questions.answers]]
label = "Several that answer the same question"
points_to = ["systematic_review_meta_analysis"]
[[questions.answers]]
label = "A large, varied body of work"
points_to = ["scoping_review", "systematic_review_narrative"]

# ---------- Synthesis methods
[[synthesis_methods]]
id = "meta_analysis"
title = "Meta-analysis"
what = "Statistically combines effect sizes from comparable studies into a pooled estimate with a confidence interval, and measures how much the studies disagree (heterogeneity, for example I²)."
advisable_when = ["At least two studies (in practice usually more) answer the same question with similar populations, interventions or exposures, and outcomes", "Each study reports an effect size, or the numbers needed to compute one (means and SDs, counts, correlations), with sample sizes", "Study designs are similar enough to combine; randomised and observational studies are not pooled together without a stated reason", "The effect measure, model (fixed or random effects) and subgroups were planned before seeing results"]
not_advisable_when = ["Outcomes are measured in incompatible ways or the constructs differ", "Too few studies, or most do not report usable numbers", "Heterogeneity is very high and you cannot explain it", "The evidence is mostly qualitative", "Most studies are at high risk of bias, which a pooled number would hide"]
available = false
in_this_app = "Not built yet. Effect-size extraction and verification come first; pooling will be computed in code, never by the AI (planned task M3.16). Until then, run it in dedicated statistics software and report it with PRISMA 2020."

[[synthesis_methods]]
id = "narrative_swim"
title = "Narrative synthesis (Synthesis Without Meta-analysis, SWiM)"
what = "Groups studies (by design, population or outcome) and summarises them in structured text and tables, including the direction of each effect."
advisable_when = ["Studies are too different to pool", "Effect sizes are reported inconsistently", "You still want a structured, transparent comparison"]
not_advisable_when = ["A meta-analysis is feasible and appropriate; narrative alone wastes the numeric data", "You count 'significant' versus 'not significant' studies; summarise direction of effect instead"]
available = true
in_this_app = "The Ask step answers questions from your verified sources, with citations. Structured SWiM tables are not built yet."

[[synthesis_methods]]
id = "thematic_synthesis"
title = "Thematic synthesis"
what = "Codes the findings of qualitative studies line by line, then builds descriptive and analytical themes across studies."
advisable_when = ["Most included studies are qualitative", "Your question is about experiences, views or processes"]
not_advisable_when = ["You need an estimate of how large an effect is"]
available = false
in_this_app = "Thematic clustering exists in the API only and is off by default; no screen yet."

[[synthesis_methods]]
id = "descriptive_mapping"
title = "Descriptive mapping"
what = "Charts the characteristics of the studies found (methods, populations, contexts, years) to show where evidence is dense and where it is missing."
advisable_when = ["Scoping reviews", "Finding research gaps before choosing a focused question"]
not_advisable_when = ["You need to say whether something works"]
available = false
in_this_app = "The coverage matrix and publication-year trends exist in the API only; no screen yet."
