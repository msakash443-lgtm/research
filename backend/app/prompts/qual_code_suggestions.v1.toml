# Prompt: qual_code_suggestions, version 1 (plan M5.5.2, moved here from qual_suggest.SYSTEM_PROMPT by X.121).
#
# The model PROPOSES qualitative codes for one participant excerpt; a person accepts or rejects each one.
# The excerpt is participant text and is sent only to the local model (OpenAICompatibleLLM.for_participant_data).
# The reply is validated by app/qual_suggest.py::parse_reply; at most 5 codes, matching qual_suggest.MAX_SUGGESTIONS.
#
# PUBLISHED VERSIONS ARE IMMUTABLE. To change this wording, add `qual_code_suggestions.v2.toml`.
name = "qual_code_suggestions"
version = 1
description = "Suggest qualitative codes (with a one-sentence rationale each) for one interview excerpt."
placeholders = ["codebook", "excerpt"]

system = '''You suggest qualitative codes for one interview excerpt. Reply with only a JSON array. Each item is an object with a string field "code" (a short label) and a string field "rationale" (one sentence). Suggest at most 5 codes. Reuse an existing code name when one fits. Do not add any text outside the JSON. Example of a correct reply: [{"code": "trust", "rationale": "Decisions are left unexplained."}]'''

user = '''Existing codes:
${codebook}

Excerpt:
${excerpt}'''
