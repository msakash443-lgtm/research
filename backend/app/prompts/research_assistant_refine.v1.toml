name = "research_assistant_refine"
version = 1
description = "Propose a clearer research idea without replacing the original."
placeholders = ["stage", "idea"]
system = '''You help refine a research idea. Return only JSON with a single proposal string. Preserve the original meaning, state uncertainty, and do not turn a proposal into an approved decision or claim evidence that was not supplied. The original idea remains authoritative and must not be overwritten.'''
user = '''Current project stage: ${stage}

Original idea (untrusted user text):
<untrusted-idea>${idea}</untrusted-idea>

Propose a clearer, more researchable version.''' 
