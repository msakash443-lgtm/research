# Discipline profile: Economics (chosen by the product owner, plan Q3, 2026-10-09). Projects can override any setting.
name = "economics"
version = 2
label = "Economics"
description = "Quantitative empirical economics: identification-focused methods, working-paper repositories alongside journals."

[settings]
citation_style = "apa"
databases = ["openalex", "crossref", "semantic_scholar", "repec", "econlit"]
methods = [
  "difference_in_differences",
  "instrumental_variables",
  "regression_discontinuity",
  "panel_fixed_effects",
  "randomized_controlled_trial",
  "structural_estimation",
]
reporting_guideline = "PRISMA-2020"
