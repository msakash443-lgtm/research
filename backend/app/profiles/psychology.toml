# Discipline profile: Psychology (chosen by the product owner, plan Q3, 2026-10-09). Projects can override any setting.
name = "psychology"
version = 1
label = "Psychology"
description = "Psychological science: experimental, survey and longitudinal designs; PsycINFO alongside biomedical indexes."

