# Discipline profile: English literature (chosen by the product owner, plan Q3, 2026-10-09). Projects can override any setting.
name = "english_literature"
version = 1
label = "English literature"
description = "Literary studies: close reading, historicist and comparative approaches; MLA bibliography and JSTOR."

