services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_ai}
      POSTGRES_USER: ${POSTGRES_USER:-research_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research_ai}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-research_ai}
      RUN_RESEARCH_INLINE: "false"
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research_ai}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-research_ai}
      RUN_RESEARCH_INLINE: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
