services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_ai}
      POSTGRES_USER: ${POSTGRES_USER:-research_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # X.4.4: loopback only, so the dev database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research_ai}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-research_ai}
      RUN_RESEARCH_INLINE: "false"
      OBJECT_STORAGE_ROOT: /data/objects
    volumes:
      - object_data:/data/objects
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research_ai}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-research_ai}
      RUN_RESEARCH_INLINE: "false"
      OBJECT_STORAGE_ROOT: /data/objects
    volumes:
      - object_data:/data/objects
    depends_on:
      db:
        condition: service_healthy

  # X.9 (optional): ARC sandbox image for co-located dev. Enabled only with `--profile arc`.
  # This is the Dockerfile.generic sandbox (runs main.py, no HTTP server), not the retrieval service.
  arc:
    profiles: ["arc"]
    build:
      context: ${ARC_REPO_PATH:?set ARC_REPO_PATH in .env (see .env.example)}/researchclaw/docker
      dockerfile: Dockerfile.generic
    image: researchclaw/sandbox-generic:latest

volumes:
  postgres_data:
  object_data:
