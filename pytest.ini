[pytest]
pythonpath = backend
testpaths = backend/tests
addopts = -n auto --dist loadfile
faulthandler_timeout = 120
markers =
    real_db: needs real commits, a second connection, lock contention, DDL or Alembic; gets a freshly cloned database instead of the per-test rollback transaction.
    slow: the slowest tests (performance budgets, the Alembic chain, subprocesses, tests that page through hundreds of records; about 1-2% of the suite, from --durations). Skip them while iterating with -m "not slow" (add --lf to rerun only what failed); the full run and the merge gate include them.
    requires_graphviz: needs the Graphviz `dot` binary at Settings.graphviz_dot_path (default `dot` on PATH; set GRAPHVIZ_DOT_PATH to an absolute path on Windows, e.g. after winget install --exact --id Graphviz.Graphviz); skipped with a stated reason when it cannot be found.
