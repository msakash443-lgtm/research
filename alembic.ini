[alembic]
script_location = %(here)s/backend/migrations
# Alembic 1.14 splits this on spaces, commas and colons, so the absolute path breaks on
# Windows (drive colon) and under folders with spaces; `backend` covers runs from the repo root.
prepend_sys_path = backend %(here)s/backend
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
